<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#215848">
  <title>Property Desk — A little help with home</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/lucide.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body data-portal="tenant">
  <a class="skip-link" href="#app">Skip to content</a>
  <div class="demo-banner"><span class="demo-label">Local demo</span><span>Messages, bookings and work instructions are simulated. Use fictional details.</span></div>
  <header class="app-header">
    <button class="brand" data-action="portal-home" aria-label="Property Desk home"><span class="brand-mark" id="brand-icon" aria-hidden="true"></span><span>Property Desk<small>A little help with home.</small></span></button>
    <nav class="portal-switch" aria-label="Demo view"><button data-portal="tenant" class="active" aria-pressed="true">Tenant</button><button data-portal="manager" aria-pressed="false">Property management</button></nav>
    <div class="header-context" id="header-context">Your home, looked after</div>
  </header>
  <div class="manager-toolbar manager-only hidden">
    <nav class="main-nav" aria-label="Management navigation"><button data-view="cases" class="nav-link active">Requests <span id="case-count" class="nav-count">0</span></button><button data-view="reviews" class="nav-link">Human review <span id="review-count" class="nav-count">0</span></button><button data-view="policies" class="nav-link">Policy settings</button></nav>
    <div class="session-switch"><label for="session-role">Demo role</label><select id="session-role"><option value="case_manager">Case manager</option><option value="policy_editor">Policy editor</option><option value="access_officer">Access officer</option><option value="approver">Approver</option><option value="reviewer">Reviewer</option></select></div>
  </div>
  <main id="app" tabindex="-1"><div class="loading-state"><span class="loading-dot"></span>Getting things ready…</div></main>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <footer class="app-footer"><span>Clear next steps. A record you can trust.</span><span id="runtime-label">Local demonstration · No real communications or bookings</span></footer>
</body>
</html>
