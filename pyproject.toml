[project]
name = "property-workflow"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.118.0", "uvicorn==0.37.0", "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.10", "pydantic==2.14.0", "httpx==0.28.1",
  "vercel-workflow==0.11.1"
]

[dependency-groups]
dev = ["pytest==8.4.2", "pypdf==6.1.1"]

[[tool.vercel.workflows]]
entrypoint = "app.workflows:wf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
